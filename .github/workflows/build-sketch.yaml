name: Build Sketch

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install board core
        run: |
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:samd
      - name: Install libraries
        run: |
          # Allow "unsafe" Seeed_GFX library install from GitHub since it's not in the Arduino Library Manager
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/Seeed-Studio/Seeed_GFX
          arduino-cli lib install "Seeed Arduino FS" "Seeed Arduino SFUD" "SparkFun BQ27441 LiPo Fuel Gauge Arduino Library"
      - name: Compile sketch
        run: arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal .
